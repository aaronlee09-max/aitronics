name: Update Melon chart

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_melon_chart.py"
      - ".github/workflows/update-melon-chart.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Melon TOP100
        run: python3 scripts/fetch_melon_chart.py
      - name: Commit chart.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart.json
          if git diff --staged --quiet; then
            echo "chart unchanged"
          else
            git commit -m "chore: refresh Melon TOP100 chart"
            git push
          fi
