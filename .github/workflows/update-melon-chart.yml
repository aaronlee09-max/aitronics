name: Update Melon chart

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick = ranks + missing links, full = retry empty Official Audio/MV/streaming links"
        required: false
        default: "full"
        type: choice
        options:
          - quick
          - full
  push:
    paths:
      - "scripts/fetch_melon_chart.py"
      - "scripts/fetch_youtube_chart.py"
      - "scripts/generate_melon_pdfs.py"
      - ".github/workflows/update-melon-chart.yml"

permissions:
  contents: write

concurrency:
  group: melon-chart-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: Sync Melon chart and follow-up links
        env:
          CHART_MODE: ${{ github.event.inputs.mode || 'quick' }}
        run: |
          MODE="$CHART_MODE"
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ] || [ "${{ github.event_name }}" = "push" ]; then
            MODE=full
          fi
          echo "chart mode=$MODE"
          python3 scripts/fetch_melon_chart.py --mode "$MODE"
      - name: Sync YouTube Music Korea weekly Top Songs
        run: python3 scripts/fetch_youtube_chart.py
      - name: Validate chart links and rank data
        run: python3 scripts/validate_chart.py
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install reportlab
      - name: Generate Melon TOP100 PDF downloads
        run: python3 scripts/generate_melon_pdfs.py
      - name: Commit chart.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart.json chart_previous.json youtube_chart.json downloads/Melon_Top100_bakgwangil.b64 downloads/Melon_Top100_yoondongju.b64
          if git diff --staged --quiet; then
            echo "chart unchanged"
          else
            git commit -m "chore: auto-sync Melon chart and official follow-up links"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
