name: Wipe class-site mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover course mirror folders
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          rm -rf ai curriculum data informatics pepe software tools
          git add -A
          if git diff --staged --quiet; then
            echo nothing to delete
          else
            git commit -m "remove leftover class-site mirror files"
            git push
          fi
