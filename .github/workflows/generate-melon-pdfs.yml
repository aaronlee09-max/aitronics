name: Generate Melon PDFs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Melon chart"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: melon-pdf-build
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install reportlab
      - name: Generate Melon TOP100 PDF downloads
        run: python3 scripts/generate_melon_pdfs.py
      - name: Commit PDF base64 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Melon_Top100_bakgwangil.b64 downloads/Melon_Top100_yoondongju.b64
          if git diff --staged --quiet; then
            echo "pdfs unchanged"
          else
            git commit -m "chore: update daily melon top100 pdfs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
