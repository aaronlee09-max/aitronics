<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>informatics.run.place</title>
    <style>
      :root { --bg:#f7fafc; --ink:#172033; --muted:#5c6b7d; --line:#d7e0ea; --blue:#2563eb; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; background: var(--bg); color: var(--ink);
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        display: grid; place-items: center;
      }
      main { width: min(640px, calc(100% - 40px)); }
      h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); }
      p { margin: 0 0 10px; color: var(--muted); line-height: 1.55; }
      a { color: var(--blue); font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>informatics.run.place</h1>
      <p>이 도메인·저장소는 수업 사이트가 아닙니다. 다른 용도로 써도 됩니다.</p>
      <p>정보 수업 사이트는 <a href="https://aaronlee.run.place">aaronlee.run.place</a> 입니다.</p>
    </main>
  </body>
</html>
