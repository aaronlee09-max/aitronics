<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정보</title>
    <style>
      :root {
        --bg: #f7fafc;
        --paper: #ffffff;
        --ink: #172033;
        --muted: #5c6b7d;
        --line: #d7e0ea;
        --blue: #2563eb;
        --green: #159957;
        --orange: #f28c28;
        --red: #e84a5f;
        --purple: #7c3aed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: 64px 0;
      }

      header {
        margin-bottom: 34px;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 7vw, 82px);
        line-height: 1;
      }

      .courses {
        display: grid;
        gap: 14px;
      }

      .course {
        display: grid;
        grid-template-columns: 116px 1fr auto;
        align-items: center;
        gap: 24px;
        min-height: 118px;
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 22px 26px;
        background: var(--paper);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .course:hover,
      .course:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(37, 99, 235, 0.4);
        box-shadow: 0 16px 38px rgba(23, 32, 51, 0.1);
      }

      .number {
        color: var(--blue);
        font-size: 42px;
        font-weight: 900;
      }

      .course:nth-child(2) .number { color: var(--green); }
      .course:nth-child(3) .number { color: var(--orange); }
      .course:nth-child(4) .number { color: var(--red); }
      .course:nth-child(5) .number { color: var(--purple); }

      .title {
        display: grid;
        gap: 6px;
      }

      .title b {
        font-size: clamp(28px, 3vw, 40px);
        line-height: 1.12;
      }

      .title span {
        color: var(--muted);
        font-size: 18px;
        font-weight: 800;
      }

      .arrow {
        color: var(--muted);
        font-size: 28px;
        font-weight: 700;
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 28px, 1120px);
          padding: 36px 0 56px;
        }

        .course {
          grid-template-columns: 72px 1fr auto;
          gap: 14px;
          min-height: 96px;
          padding: 16px 18px;
        }

        .number {
          font-size: 28px;
        }

        .title b {
          font-size: 24px;
        }

        .title span {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>정보</h1>
      </header>

      <div class="courses">
        <a class="course" href="informatics/">
          <div class="number">01</div>
          <div class="title">
            <b>정보</b>
            <span>Informatics</span>
          </div>
          <div class="arrow">→</div>
        </a>

        <a class="course" href="ai/">
          <div class="number">02</div>
          <div class="title">
            <b>인공지능 기초</b>
            <span>Artificial Intelligence</span>
          </div>
          <div class="arrow">→</div>
        </a>

        <a class="course" href="data/">
          <div class="number">03</div>
          <div class="title">
            <b>데이터 과학</b>
            <span>Data Science</span>
          </div>
          <div class="arrow">→</div>
        </a>

        <a class="course" href="software/">
          <div class="number">04</div>
          <div class="title">
            <b>소프트웨어와 생활</b>
            <span>Software and Life</span>
          </div>
          <div class="arrow">→</div>
        </a>

        <a class="course" href="curriculum/">
          <div class="number">05</div>
          <div class="title">
            <b>교육과정</b>
            <span>Curriculum</span>
          </div>
          <div class="arrow">→</div>
        </a>
      </div>
    </div>
  </body>
</html>
